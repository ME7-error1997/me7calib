[project]
name = "me7calib"
version = "0.1.0"
description = "Log-driven map calibration for Bosch ME7 ECUs: logger CSVs and a WinOLS export in, corrected maps out"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "PySide6>=6.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
me7calib = "me7calib.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["me7calib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
